<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Fee Reminders - SAGAR PUBLIC SCHOOL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; }
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .card-header { background-color: #1a237e; color: white; border-radius: 12px 12px 0 0 !important; padding: 15px 20px; }
    .table thead { background-color: #1a237e; color: white; }
    .fee-input { width: 95px; text-align: center; font-weight: bold; }
    .badge-class { background-color: #e8eaf6; color: #1a237e; font-weight: bold; }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h4 class="m-0 fw-bold"><i class="bi bi-bell-fill me-2"></i>Pending Fee Reminders</h4>
      <div class="d-flex align-items-center gap-2">
        <select id="classFilter" class="form-select form-select-sm fw-bold" style="width: 150px;" onchange="filterData()">
          <option value="ALL">ALL CLASSES</option>
        </select>
        <span class="badge bg-light text-dark fs-6" id="totalCount">Total Students: 0</span>
        <button class="btn btn-sm btn-light fw-bold" onclick="loadStudents()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
    </div>
    
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0 text-center">
          <thead>
            <tr>
              <th>Class</th>
              <th>Roll No</th>
              <th>Student Name</th>
              <th>Father Name</th>
              <th>Previous Fee (₹)</th>
              <th>Monthly Fee (₹)</th>
              <th>Total Due (₹)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr><td colspan="8" class="text-center py-4 text-muted"><div class="spinner-border text-primary spinner-border-sm me-2"></div>Loading Data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // अपना Web App URL नीचे पेस्ट करें
  const API_URL = "https://script.google.com/macros/s/AKfycbySsCcmfKHVNTT4H2rpbBIxkkKGjhBDEmxQjjH-OAUpyvFk-bal780WmJeB7oe01noX/exec";

  let allStudentsData = [];

  window.onload = function() {
    loadStudents();
  };

  async function loadStudents() {
    document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted"><div class="spinner-border text-primary spinner-border-sm me-2"></div>Loading Data...</td></tr>';
    
    try {
      let res = await fetch(`${API_URL}?action=getStudents`);
      let data = await res.json();
      allStudentsData = data;
      populateClassDropdown(data);
      filterData();
    } catch(err) {
      document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="8" class="text-danger py-4 fw-bold">Error loading data. Check Web App Deployment!</td></tr>';
    }
  }

  function populateClassDropdown(data) {
    let classes = [...new Set(data.map(item => item.sClass))].filter(Boolean).sort();
    let filterSelect = document.getElementById('classFilter');
    filterSelect.innerHTML = '<option value="ALL">ALL CLASSES</option>';
    classes.forEach(c => {
      filterSelect.innerHTML += `<option value="${c}">Class ${c}</option>`;
    });
  }

  function filterData() {
    let selectedClass = document.getElementById('classFilter').value;
    let filtered = allStudentsData;

    if (selectedClass !== 'ALL') {
      filtered = allStudentsData.filter(s => String(s.sClass) === String(selectedClass));
    }

    document.getElementById('totalCount').innerText = `Total Students: ${filtered.length}`;
    let tbody = document.getElementById('studentTableBody');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-danger py-4 fw-bold">No reminder data found in sheet.</td></tr>';
      return;
    }

    filtered.forEach(s => {
      let prevVal = s.prevFee || 0;
      let monthVal = s.monthlyFee || 0;
      let total = parseFloat(prevVal) + parseFloat(monthVal);

      let row = `
        <tr id="row-${s.rowIndex}">
          <td><span class="badge badge-class">${s.sClass}</span></td>
          <td>${s.rollNo}</td>
          <td class="fw-bold text-start ps-3">${s.name}</td>
          <td class="text-start ps-3">${s.fatherName}</td>
          <td>
            <input type="number" class="form-control form-control-sm fee-input mx-auto" id="prev-${s.rowIndex}" value="${prevVal}" oninput="calculateTotal(${s.rowIndex})">
          </td>
          <td>
            <input type="number" class="form-control form-control-sm fee-input mx-auto" id="month-${s.rowIndex}" value="${monthVal}" oninput="calculateTotal(${s.rowIndex})">
          </td>
          <td class="fw-bold text-danger fs-6" id="total-${s.rowIndex}">₹${total}</td>
          <td>
            <button class="btn btn-sm btn-success fw-bold px-3" id="btn-${s.rowIndex}" onclick="sendReminder(${s.rowIndex})">
               Save & Send 📲
            </button>
          </td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  function calculateTotal(rowIndex) {
    let prev = parseFloat(document.getElementById(`prev-${rowIndex}`).value) || 0;
    let month = parseFloat(document.getElementById(`month-${rowIndex}`).value) || 0;
    document.getElementById(`total-${rowIndex}`).innerText = '₹' + (prev + month);
  }

  async function sendReminder(rowIndex) {
    let prevFee = parseFloat(document.getElementById(`prev-${rowIndex}`).value) || 0;
    let monthlyFee = parseFloat(document.getElementById(`month-${rowIndex}`).value) || 0;
    let totalDue = prevFee + monthlyFee;

    let student = allStudentsData.find(x => x.rowIndex == rowIndex);
    let btn = document.getElementById(`btn-${rowIndex}`);

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Saving...`;

    try {
      // POST request to update Google Sheet
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          rowIndex: rowIndex,
          prevFee: prevFee,
          monthlyFee: monthlyFee
        })
      });

      btn.disabled = false;
      btn.innerHTML = `Save & Send 📲`;

      // WhatsApp URL formatting
      let phone = String(student.whatsappNo).replace(/[^0-9]/g, '');
      if (phone.length === 10) phone = '91' + phone;

      let message = `Dear Parent (${student.fatherName}), SAGAR PUBLIC SCHOOL ki taraf se reminder: ${student.name} (Class: ${student.sClass}) ki kul fees balance ₹${totalDue} hai (Monthly Fee: ₹${monthlyFee} + Pichhla Dues: ₹${prevFee}). Kripya niche diye gaye UPI ID par payment karein ya QR code scan karein: upi://pay?pa=riyazahmad5@okaxis&am=${totalDue} Dhanyawad!`;

      let waUrl = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;
      
      // Open WhatsApp
      window.open(waUrl, '_blank');

    } catch(err) {
      alert("Saving failed! Please try again.");
      btn.disabled = false;
      btn.innerHTML = `Save & Send 📲`;
    }
  }
</script>

</body>
</html>
