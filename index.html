<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsoi Public School - Advanced Fee Reminder</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --whatsapp: #25D366;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: #1e293b; padding-bottom: 50px; }

        .navbar {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }
        .navbar h1 { font-size: 22px; font-weight: 700; }
        .navbar p { font-size: 13px; color: #94a3b8; margin-top: 2px; }

        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

        /* CONTROLS */
        .bar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .search-input, .select-input {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .search-input { flex: 1; min-width: 200px; }

        /* GRID CARDS FOR MOBILE / TABLE FOR DESKTOP */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .student-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .badge-class {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .fee-breakdown {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 13px;
        }
        .fee-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .fee-row.total { font-weight: 700; font-size: 15px; color: var(--danger); border-top: 1px dashed #cbd5e1; padding-top: 6px; margin-bottom: 0; }

        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-wa { background: var(--whatsapp); color: white; }
        .btn-qr { background: #0284c7; color: white; }

        /* MODAL FOR QR */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .qr-img { width: 200px; height: 200px; margin: 15px 0; border: 1px solid #ddd; padding: 5px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>BARSOI PUBLIC SCHOOL</h1>
        <p>14-Tab Automated Fee & WhatsApp Reminder System</p>
    </div>

    <div class="container">
        <div class="bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 स्टूडेंट नाम / रोल नंबर खोजें..." onkeyup="filterCards()">
            <select id="classFilter" class="select-input" onchange="filterCards()">
                <option value="ALL">सभी क्लास</option>
            </select>
            <span id="totalCount" style="font-size: 13px; font-weight:700; color:var(--accent);">Total: 0</span>
        </div>

        <div id="cardsContainer" class="cards-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">गूगल शीट से 14-Tabs का डेटा सिंक हो रहा है...</p>
            </div>
        </div>
    </div>

    <!-- QR CODE MODAL -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <h3 id="modalStudent">UPI Payment QR</h3>
            <img id="modalQrImg" src="" class="qr-img" alt="UPI QR Code">
            <p style="font-size: 13px; color:#475569;">UPI ID: <b>riyazahmad5@okaxis</b></p>
            <p id="modalAmount" style="font-size: 16px; font-weight:700; color:var(--danger); margin-top:5px;"></p>
            <button class="btn" style="background:#64748b; color:white; margin-top:15px;" onclick="closeModal()">बंद करें</button>
        </div>
    </div>

    <script>
        // Google Web App Deployment URL यहाँ डालें
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynnbWu1GBKgg6jKccSYdAr18FcXS8eVo-QqWKRDXVwIzXzWv2MCz4pzE7mFk3_3TyE/exec"; 
        let studentData = [];

        window.onload = loadData;

        function loadData() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(renderData).getDynamicReminderData();
            } else {
                fetch(`${SCRIPT_URL}?action=getDynamicReminderData`)
                    .then(res => res.json())
                    .then(json => renderData(json));
            }
        }

        function renderData(res) {
            const container = document.getElementById('cardsContainer');
            if (!res || !res.success || !res.data) {
                container.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:red;">डेटा लोड करने में समस्या आई! कृपया Apps Script चेक करें।</div>`;
                return;
            }

            studentData = res.data;
            populateClasses();
            filterCards();
        }

        function populateClasses() {
            let classes = [...new Set(studentData.map(s => s.className))];
            let select = document.getElementById('classFilter');
            select.innerHTML = '<option value="ALL">सभी क्लास</option>';
            classes.forEach(c => select.innerHTML += `<option value="${c}">Class ${c}</option>`);
        }

        function filterCards() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cls = document.getElementById('classFilter').value;
            const container = document.getElementById('cardsContainer');

            let filtered = studentData.filter(s => {
                let matchCls = (cls === 'ALL' || s.className === cls);
                let matchSearch = s.name.toLowerCase().includes(search) || s.rollNo.toString().includes(search);
                return matchCls && matchSearch;
            });

            document.getElementById('totalCount').innerText = `Total: ${filtered.length}`;

            if(filtered.length === 0) {
                container.innerHTML = `<div style="grid-column:1/-1; text-align:center;">कोई डेटा नहीं मिला!</div>`;
                return;
            }

            container.innerHTML = filtered.map(s => {
                let cleanPhone = s.phone.replace(/[^0-9]/g, '');
                if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

                // Professional WhatsApp Message Format
                let msg = `*BARSOI PUBLIC SCHOOL*\n` +
                          `--------------------------------\n` +
                          `*FEE REMINDER NOTICE*\n\n` +
                          `छात्र/छात्रा: *${s.name}*\n` +
                          `पिता: ${s.father}\n` +
                          `Class: *${s.className}* | Roll No: *${s.rollNo}*\n\n` +
                          `-- *FEE DETAILS* --\n` +
                          `Monthly Fee (FeesMaster): ₹${s.monthlyFee}\n` +
                          `Previous Balance (${s.activeMonth || 'Due'}): ₹${s.previousDue}\n` +
                          `--------------------------------\n` +
                          `*TOTAL PAYABLE: ₹${s.totalPayable}*\n` +
                          `--------------------------------\n\n` +
                          `*Payment via PhonePe/GPay/Paytm:* \n` +
                          `UPI ID: *${s.upiId}*\n\n` +
                          `कृपया जल्द से जल्द भुगतान करें। धन्यवाद!`;

                let waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;

                return `
                    <div class="student-card">
                        <div>
                            <div class="card-header">
                                <div>
                                    <h3 style="font-size:16px; font-weight:700;">${s.name}</h3>
                                    <p style="font-size:12px; color:#64748b;">पिता: ${s.father}</p>
                                </div>
                                <span class="badge-class">Class ${s.className}</span>
                            </div>

                            <div class="fee-breakdown">
                                <div class="fee-row">
                                    <span>Roll No:</span>
                                    <b>#${s.rollNo}</b>
                                </div>
                                <div class="fee-row">
                                    <span>Monthly Fee:</span>
                                    <span>₹${s.monthlyFee}</span>
                                </div>
                                <div class="fee-row">
                                    <span>Previous Remaining:</span>
                                    <span style="color:var(--danger)">₹${s.previousDue}</span>
                                </div>
                                <div class="fee-row total">
                                    <span>Total Amount:</span>
                                    <span>₹${s.totalPayable}</span>
                                </div>
                            </div>
                        </div>

                        <div class="action-btns">
                            <button class="btn btn-qr" onclick="showQr('${s.name}', '${s.totalPayable}', '${s.qrCodeUrl}')">
                                <i class="fa-solid fa-qrcode"></i> QR Code
                            </button>
                            <a href="${waUrl}" target="_blank" class="btn btn-wa">
                                <i class="fa-brands fa-whatsapp"></i> WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showQr(name, amount, qrUrl) {
            document.getElementById('modalStudent').innerText = name;
            document.getElementById('modalAmount').innerText = `Payable Amount: ₹${amount}`;
            document.getElementById('modalQrImg').src = qrUrl;
            document.getElementById('qrModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
    </script>
</body>
</html>
